# mise manages every CLI tool this repo needs and is the local build entrypoint (`mise run ci`).
# GitHub Actions installs the same tools with jdx/mise-action and runs the steps in containers via
# the Earthfile (`earth +ci`).
min_version = "2025.1.0"

[tools]
node = "24"
gh = "2.104.0"
"github:earthbuild/earthbuild" = { version = "0.8.19", bin = "earth" }
uv = "0.13.8" # backend for the pipx tools below
"pipx:commitizen" = "4.19.3"
"pipx:pre-commit" = "4.7.0"

[env]
_.path = ["./node_modules/.bin"]

[tasks.install]
description = "Install npm dependencies"
run = "npm ci"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks.lint]
description = "Lint and check formatting with Biome"
depends = ["install"]
run = "biome check ."

[tasks.format]
description = "Format all files with Biome"
depends = ["install"]
run = "biome check --write ."

[tasks.typecheck]
description = "Type-check sources and tests"
depends = ["install"]
run = "tsc --noEmit"

[tasks.test]
description = "Run the unit tests with coverage"
depends = ["install"]
run = "vitest run --coverage"

[tasks.build]
description = "Build ESM + CJS bundles and type declarations into dist/"
depends = ["install"]
run = "tsdown"

[tasks.smoke]
description = "Load the built package from CommonJS and ESM, and type-check its declarations"
depends = ["build"]
run = [
  "node test/smoke/smoke.cjs",
  "node test/smoke/smoke.mjs",
  "tsc -p test/smoke/tsconfig.json",
]

[tasks.pack]
description = "Show what would be published to npm"
depends = ["build"]
run = "npm pack --dry-run"

[tasks.hooks]
description = "Install the git hooks (pre-commit, commit-msg, pre-push) from .pre-commit-config.yaml"
run = "pre-commit install"

[tasks.bump]
description = "Preview the next version and changelog commitizen would release"
run = "cz bump --dry-run --changelog"

[tasks.clean]
description = "Remove build and coverage output"
run = "rm -rf dist coverage"

[tasks.ci]
description = "Everything CI runs: lint, typecheck, test, build, smoke"
depends = ["lint", "typecheck", "test", "build", "smoke"]
